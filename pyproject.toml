    "fsspec==2025.3.0",
    "huggingface-hub==0.31.2",
    "idna==3.10",
    "inquirerpy==0.3.4",
    "jinja2==3.1.4",
    "joblib==1.5.0",
    "kiwisolver==1.4.8",
